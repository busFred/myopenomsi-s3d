[package]
name = "omsi-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Simulation runtime: vehicle instances with scripts and animations, system variables, clock"

[dependencies]
omsi-cfg = { path = "../omsi-cfg" }
omsi-script = { path = "../omsi-script" }
omsi-model = { path = "../omsi-model" }
omsi-vehicle = { path = "../omsi-vehicle" }
omsi-o3d = { path = "../omsi-o3d" }
omsi-geometry = { path = "../omsi-geometry" }
omsi-content = { path = "../omsi-content" }
omsi-scenery = { path = "../omsi-scenery" }
glam.workspace = true
log.workspace = true
anyhow.workspace = true
hashbrown.workspace = true
# (`rc`: a car's traffic pool is shared, and a traffic recording writes it out)
serde = { workspace = true, features = ["rc"] }
omsi-texture = { path = "../omsi-texture" }
parking_lot = { workspace = true }
ab_glyph.workspace = true

[dev-dependencies]
omsi-audio = { path = "../omsi-audio" }
