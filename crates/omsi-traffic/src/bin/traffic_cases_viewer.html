<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>__TITLE__</title>
<style>
:root{color-scheme:light;--fg:#182536;--mut:#506176;--bd:#c8d2df;--cd:#ffffff;--ac:#075daf;--bg:#f2f5f9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);padding:28px 24px 40px}
.tc{font:15px/1.6 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--fg);max-width:1200px;margin:auto}
.tc h1{font-size:clamp(22px,2.5vw,30px);line-height:1.25;letter-spacing:-.025em;margin:0 0 12px}
.tc a{color:var(--ac);text-underline-offset:3px}
.tc a:hover{color:#03467f}
.tc a.vid{font-weight:650;text-decoration:none;border-bottom:1px dotted var(--ac);padding:1px 2px}
.tc .row{display:grid;grid-template-columns:minmax(0,700px) minmax(280px,1fr);gap:16px;align-items:start}
.tc canvas{display:block;width:100%;height:auto;aspect-ratio:700/520;border:1px solid #9cacc0;border-radius:10px;background:#1d2126;cursor:crosshair}
.tc .side{min-width:0;border:1px solid var(--bd);border-radius:10px;background:var(--cd);padding:18px;max-height:520px;overflow:auto;scrollbar-color:#9cacc0 var(--cd)}
.tc .ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:20px 0 14px;padding:14px;border:1px solid var(--bd);border-radius:10px;background:var(--cd)}
.tc .ctl input[type=range]{flex:1;min-width:120px;accent-color:#075daf;cursor:pointer;height:32px}
.tc button,.tc select,.tc input[type=text]{font:inherit;color:var(--fg);background:#edf2f8;border:1px solid #9cacc0;border-radius:6px;padding:7px 12px;min-height:40px}
.tc button{cursor:pointer;font-weight:600}
.tc button:hover,.tc select:hover{background:#dce9f7;border-color:#075daf}
.tc :is(button,select,input,a,summary):focus-visible{outline:3px solid #075daf;outline-offset:3px}
.tc #play{background:#075daf;color:#ffffff;border-color:#075daf;min-width:76px}
.tc #play:hover{background:#03467f}
.tc input[type=text]{width:164px;min-width:0}
.tc input::placeholder{color:#596b80;opacity:1}
.tc .mut{color:var(--mut)}
.tc #sub{margin-bottom:20px;max-width:100ch}
.tc table{border-collapse:collapse;width:100%;margin:12px 0;font-variant-numeric:tabular-nums}
.tc td{padding:6px 5px;border-bottom:1px solid var(--bd);vertical-align:top;overflow-wrap:anywhere}
.tc td:first-child{color:var(--mut);white-space:nowrap;width:38%}
.tc .lg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;margin:20px 0 12px;padding-top:16px;border-top:1px solid var(--bd);font-size:13px}
.tc .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tc .note{font-size:14px;line-height:1.65;color:var(--mut);white-space:pre-wrap;overflow-wrap:anywhere}
.tc .t{font:600 17px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums;min-width:84px;color:#182536}
.tc details{border:1px solid var(--bd);border-radius:10px;margin:14px 0;padding:14px 18px;background:var(--cd)}
.tc summary{cursor:pointer;font-weight:650;color:#233e5d}
.tc details[open]>summary{margin-bottom:12px}
.tc .shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:14px;margin-top:12px}
.tc .shots a{display:block;background:#e9eef5;border-radius:8px}
.tc .shots img{display:block;width:100%;height:auto;max-height:300px;object-fit:contain;border:1px solid var(--bd);border-radius:8px}
.tc .roots div{margin:12px 0;padding:4px 0 4px 14px;border-left:3px solid #075daf;overflow-wrap:anywhere}
.tc .roots b{color:#075daf}
.tc .chains{max-height:360px;overflow:auto;font-size:14px;scrollbar-color:#9cacc0 var(--cd)}
.tc .car{margin:0 0 14px;padding-bottom:14px;border-bottom:1px solid var(--bd);overflow-wrap:anywhere}
.tc .hop{padding-left:18px;color:var(--mut)}
.tc .hop.term{color:var(--fg)}
.tc .cars{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.tc .cars button{padding:6px 9px;font-size:13px;min-height:34px;font-variant-numeric:tabular-nums}
.tc .cars button.on{background:#075daf;color:#ffffff;border-color:#075daf;outline:2px solid #075daf;outline-offset:2px}
.tc .msg{color:#b42332;font-weight:600;margin-bottom:10px}
@media(max-width:1050px){.tc .row{grid-template-columns:minmax(0,700px);justify-content:center}.tc .side{max-height:none}.tc .lg{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:600px){body{padding:18px 12px 28px}.tc .ctl{gap:10px;padding:12px}.tc .ctl input[type=range]{order:1;flex-basis:100%}.tc input[type=text]{flex:1;width:120px}.tc .side,.tc details{padding:14px}.tc .lg{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body>
<div class="tc">
<h1>__TITLE__</h1>
<div class="mut" id="sub"></div>
__SHOTS__
<div id="diag"></div>
<div class="ctl"><button id="play">Play</button><select id="spd" aria-label="Playback speed"><option>0.5</option><option selected>1</option><option>2</option><option>4</option><option>8</option></select><span class="t" id="time"></span><input type="range" id="scrub" aria-label="Timeline" min="0" value="0"><button id="fit" title="reset the view">Fit</button><input type="text" id="find" aria-label="Find vehicle id" placeholder="find vehicle id" title="type a vehicle id, Enter"></div>
<div class="row"><canvas id="cv" width="700" height="520"></canvas>
<div class="side"><div id="pin"><span class="mut">Click a vehicle or a pedestrian. Drag to pan, wheel to zoom.</span></div>
<div id="carlist"></div>
<div class="lg" id="legend"></div><div class="note" id="notes"></div></div></div>
</div>
<script id="data" type="application/json">__DATA__</script>
<script id="diagdata" type="application/json">__DIAG__</script>
<script>
// ==PANE-BEGIN== (shared by traffic_cases_viewer.html and traffic_cases_viewer2.html: viewer2 gets this block pasted in by traffic_cases.rs)
const WHY={none:'#8b949e',lead:'#4f8ef7',light:'#e5534b',yield:'#f0883e',exit:'#f0883e',people:'#b57edc',zebra:'#b57edc',service:'#3fb950',merge:'#2bb5a8',let_out:'#2bb5a8',pull_out:'#8b949e',end:'#8b949e'};
const LEG=[['none','#8b949e'],['lead','#4f8ef7'],['light','#e5534b'],['yield / exit','#f0883e'],['people / zebra','#b57edc'],['service','#3fb950'],['merge / let_out','#2bb5a8'],['player bus','#ffffff']];
function legendHTML(){return LEG.map(([n,c])=>`<span><span class="sw" style="background:${c};border:1px solid #555"></span>${n}</span>`).join('')+`<span><span class="sw" style="border:2px solid #ffd33d"></span>passing</span><span><span class="sw" style="border-radius:5px;background:#ccc"></span>person (ring: decision)</span>`;}
function lightCol(s){if(s==null||s<0)return '#555';if(s<=2)return '#e5534b';if(s<=5)return '#f0883e';if(s<=7)return '#3fb950';if(s==8)return '#a3d65c';if(s<=11)return '#e3b341';return '#444';}
function lightName(s){if(s==null||s<0)return '?';if(s<=2)return 'red';if(s<=5)return 'red+yellow';if(s<=7)return 'green';if(s==8)return 'green+yellow';if(s<=11)return 'yellow';return 'dark';}
const PC=['#e6edf3','#79c0ff','#ffa657','#d2a8ff','#7ee787','#ff7b72','#f2cc60','#56d4dd'];
function stateCol(i){return PC[(i==null?0:i)%PC.length];}
function hms(t){t=Math.round(t);return [Math.floor(t/3600),Math.floor(t/60)%60,t%60].map(x=>String(x).padStart(2,'0')).join(':');}
function secs(s){const [h,mi,se]=s.split(':').map(Number);return h*3600+mi*60+(se||0);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function row(k,v){return `<tr><td>${k}</td><td>${v==null?'<span class="mut">-</span>':v}</td></tr>`;}
// the fields of one vehicle row, as [name, html]
function vehFields(r){return [['lane / s',r[11]+' / '+r[12]],['speed',r[4]+' m/s'],['why','<b style="color:'+(WHY[r[5]]||'')+'">'+r[5]+'</b>'],['stop',r[6]],['lead_id',r[7]],['wait_for',r[8]],['impatience',r[9]],['held',r[13]?'yes':'no'],['hold',r[14]],['passing',r[10]?'yes':'no'],['heading',r[3]+'°']];}
// One canvas showing one trace. `o.view` is the {scale,ox,oy} the pane draws with (several panes may share one),
// `o.cars` the diagnosed vehicles by id, `o.chain` false leaves the wait chain of the pinned vehicle out.
// The caller owns the state: draw(fi, st) with st = {pinned, pinP, msg, flashUntil}.
function makePane(cv,D,o){
 o=o||{};const V=o.view||{};const CARS=o.cars||{};const chain=o.chain!==false;
 const M=D.meta,S=D.strs||[],VI=D.vinfo||{};
 const cx=cv.getContext('2d');
 const W=700,H=520;
 const dpr=window.devicePixelRatio||1;cv.width=W*dpr;cv.height=H*dpr;cx.scale(dpr,dpr);
 // frames: full rows per frame (k = ids unchanged since the previous frame)
 const F=[];let prev={},lights={},prevP=[];
 for(const f of D.frames){const cur={};
  for(const e of f.v){const id=e[0],m=e[1],o=prev[id];const r=o?o.slice():new Array(15).fill(null);r[0]=id;let j=2;for(let b=0;b<14;b++)if(m&(1<<b))r[b+1]=e[j++];cur[id]=r;}
  if(f.k)for(const id of f.k){if(prev[id])cur[id]=prev[id];}
  if(f.l){lights=Object.assign({},lights);for(const [c,li,st] of f.l)lights[c+'/'+li]=st;}
  const P=(f.pk||[]).map(i=>prevP[i]).filter(Boolean).concat(f.p||[]);
  F.push({t:f.t,v:cur,p:P.map(q=>[q[0],q[1],q[2],q[3],q[4]?Math.max(0,Math.round(f.t-q[4])):0,q[5]]),pl:f.pl,l:lights});prev=cur;prevP=P;}
 const cross=new Set();for(const c of D.crossings)for(const l of c.lanes)cross.add(l);
 const fitScale=()=>250/((M.radius||150)*0.6);
 function fit(){V.scale=fitScale();V.ox=0;V.oy=0;}
 if(V.scale==null)fit();
 function sx(x){return W/2+(x-V.ox)*V.scale;}function sy(y){return H/2-(y-V.oy)*V.scale;}
 function poly(p){cx.beginPath();for(let i=0;i<p.length;i++){const X=sx(p[i][0]),Y=sy(p[i][1]);i?cx.lineTo(X,Y):cx.moveTo(X,Y);}cx.stroke();}
 function draw(fi,st){
  const scale=V.scale,pinned=st.pinned;
  const f=F[fi];cx.clearRect(0,0,W,H);cx.fillStyle='#1d2126';cx.fillRect(0,0,W,H);
  cx.lineCap='round';cx.lineJoin='round';
  // lanes [index, kind, width, light, no_ov, density, turn, bus, pts]
  for(const L of D.lanes){const p=L[8];if(!p||p.length<2)continue;
   if(L[1]==='W'){if(!cross.has(L[0]))continue;cx.setLineDash([Math.max(1,0.5*scale),Math.max(1,0.5*scale)]);cx.lineCap='butt';cx.strokeStyle='rgba(230,237,243,0.35)';cx.lineWidth=Math.max(2,L[2]*scale);poly(p);cx.lineCap='round';cx.setLineDash([]);continue;}
   cx.strokeStyle=L[1]==='R'?'#6e5a3c':'#3a4048';cx.lineWidth=Math.max(1,Math.max(3,L[2]||3)*scale*0.85);poly(p);
   cx.strokeStyle=L[4]?'#8a8f96':'#5c636b';cx.lineWidth=1;if(L[5]===0||L[7])cx.setLineDash([4,4]);poly(p);cx.setLineDash([]);
   const n=p.length,a=p[n-2],b=p[n-1],ang=Math.atan2(-(b[1]-a[1]),b[0]-a[0]);
   cx.save();cx.translate(sx(b[0]),sy(b[1]));cx.rotate(ang);cx.fillStyle='#5c636b';cx.beginPath();cx.moveTo(0,0);cx.lineTo(-5,-2.5);cx.lineTo(-5,2.5);cx.fill();cx.restore();}
  // stop lines [x,y,h,lane,light]
  for(const s of D.stops){const h=s[2]*Math.PI/180,rx=Math.cos(h),ry=-Math.sin(h),hw=1.6;
   cx.strokeStyle='#c9d1d9';cx.lineWidth=Math.max(1,0.3*scale);cx.beginPath();cx.moveTo(sx(s[0]-rx*hw),sy(s[1]-ry*hw));cx.lineTo(sx(s[0]+rx*hw),sy(s[1]+ry*hw));cx.stroke();}
  for(const L of D.lanes){if(!L[3]||!L[8])continue;const ls=f.l[L[3][0]+'/'+L[3][1]];const q=L[8][0];
   cx.fillStyle=lightCol(ls);cx.beginPath();cx.arc(sx(q[0]),sy(q[1]),Math.max(3,0.9*scale),0,7);cx.fill();}
  // people [x,y,state,decision,still,on_crossing]
  for(const p of f.p){cx.fillStyle=stateCol(p[2]);cx.beginPath();cx.arc(sx(p[0]),sy(p[1]),Math.max(2.5,0.4*scale),0,7);cx.fill();
   if(p[3]!=null){cx.strokeStyle=S[p[3]]==='go'?'#3fb950':'#ff7b72';cx.lineWidth=1.5;cx.beginPath();cx.arc(sx(p[0]),sy(p[1]),Math.max(5,0.8*scale),0,7);cx.stroke();}}
  // vehicles
  for(const r of Object.values(f.v)){const inf=VI[r[0]]||[2.2,2.2,0.9];const fr=inf[0],re=inf[1],hw=inf[2];const h=r[3]*Math.PI/180;
   cx.save();cx.translate(sx(r[1]),sy(r[2]));cx.rotate(h);
   cx.fillStyle=WHY[r[5]]||'#8b949e';cx.fillRect(-hw*scale,-fr*scale,2*hw*scale,(fr+re)*scale);
   cx.fillStyle='rgba(0,0,0,0.45)';cx.fillRect(-hw*scale,-fr*scale,2*hw*scale,Math.min(1,fr+re)*scale);
   if(r[10]){cx.strokeStyle='#ffd33d';cx.lineWidth=2;cx.strokeRect(-hw*scale,-fr*scale,2*hw*scale,(fr+re)*scale);}
   if(pinned===r[0]){cx.strokeStyle='#fff';cx.lineWidth=2;cx.setLineDash([3,2]);cx.strokeRect(-hw*scale-3,-fr*scale-3,2*hw*scale+6,(fr+re)*scale+6);cx.setLineDash([]);}
   cx.restore();
   if(scale>5||CARS[r[0]]&&scale>3.5||r[0]===pinned){cx.fillStyle=CARS[r[0]]?'#ffd33d':'#c9d1d9';cx.font='10px system-ui';cx.fillText(r[0],sx(r[1])+hw*scale+2,sy(r[2])-2);}}
  // players [x,y,h,speed]
  for(const p of f.pl){const h=p[2]*Math.PI/180;cx.save();cx.translate(sx(p[0]),sy(p[1]));cx.rotate(h);cx.fillStyle='#ffffff';cx.strokeStyle='#000';cx.lineWidth=1;
   cx.fillRect(-1.25*scale,-6*scale,2.5*scale,12*scale);cx.strokeRect(-1.25*scale,-6*scale,2.5*scale,12*scale);cx.fillStyle='#e5534b';cx.fillRect(-1.25*scale,-6*scale,2.5*scale,Math.min(1,12)*scale);cx.restore();}
  // wait chain from the pinned vehicle
  if(chain&&pinned!=null&&f.v[pinned]){let cur=f.v[pinned];const seen=new Set();cx.lineWidth=2.5;
   for(let k=0;k<25&&cur;k++){seen.add(cur[0]);let nx=null,col='#4f8ef7';
    const w=cur[5];if((w==='yield'||w==='exit')&&cur[8]!=null){nx=cur[8];col='#f0883e';}else if(cur[7]!=null){nx=cur[7];}else if(cur[8]!=null){nx=cur[8];col='#f0883e';}
    if(nx==null)break;let tx,ty;
    if(typeof nx==='string'&&nx[0]==='P'){const p=f.pl[+nx.slice(1)]||f.pl[0];if(!p)break;tx=p[0];ty=p[1];}else{const o=f.v[nx];if(!o){break;}tx=o[1];ty=o[2];}
    cx.strokeStyle=col;cx.beginPath();cx.moveTo(sx(cur[1]),sy(cur[2]));cx.lineTo(sx(tx),sy(ty));cx.stroke();
    cx.fillStyle=col;cx.beginPath();cx.arc(sx(tx),sy(ty),4,0,7);cx.fill();
    if(typeof nx==='string'||seen.has(nx))break;cur=f.v[nx];}}
  // the flash round a vehicle just looked up
  const now=performance.now();
  if(pinned!=null&&f.v[pinned]&&now<st.flashUntil){const r=f.v[pinned],ph=(now/350)%1;
   for(const [rad,a] of [[14+ph*40,1-ph],[10,0.9]]){cx.strokeStyle=`rgba(255,0,200,${a})`;cx.lineWidth=4;cx.beginPath();cx.arc(sx(r[1]),sy(r[2]),rad,0,7);cx.stroke();}
   cx.fillStyle='#ff00c8';cx.font='bold 13px system-ui';cx.fillText('#'+pinned,sx(r[1])+16,sy(r[2])-14);}
 }
 // the text for the pin box: a pinned vehicle, a pinned pedestrian (st.pinP follows it), or the lights
 function pinHTML(fi,st){const f=F[fi];const m=st.msg?`<div class="msg">${esc(st.msg)}</div>`:'';
  if(st.pinned!=null){const r=f.v[st.pinned];const inf=VI[st.pinned]||[];const c=CARS[st.pinned];
   const dg=c?`<div class="mut">diagnosed: stood ${c.stood} s from ${c.start}; why ${esc(c.why)}</div>`:'';
   if(!r)return m+`<b>vehicle ${st.pinned}</b> <span class="mut">(not in view at this time)</span>`+dg;
   return m+`<b>vehicle ${r[0]}</b> <span class="mut">${inf[3]||''} ${inf[4]||''}</span>`+dg+`<table>`+vehFields(r).map(([k,v])=>row(k,v)).join('')+'</table><div class="mut">chain: blue = lead, orange = wait_for</div>';}
  if(st.pinP){const p=f.p.reduce((b,q)=>{const d=Math.hypot(q[0]-st.pinP[0],q[1]-st.pinP[1]);return !b||d<b[0]?[d,q]:b;},null);
   if(!p||p[0]>3)return '<span class="mut">the pedestrian is not near the pinned place now</span>';const q=p[1];st.pinP=[q[0],q[1]];
   return '<b>pedestrian</b><table>'+row('state',S[q[2]])+row('decision',q[3]==null?null:S[q[3]])+row('still',q[4]+' s')+row('on crossing',q[5]?'yes':'no')+row('at',q[0]+', '+q[1])+'</table>';}
  const ls=Object.entries(f.l).map(([k,s])=>`<span style="color:${lightCol(s)}">●</span> ${k} ${lightName(s)}`).join('<br>');
  return m+'<span class="mut">Click a vehicle or a pedestrian. Drag to pan, wheel to zoom.</span><div style="margin-top:6px">Lights:<br>'+(ls||'<span class="mut">none</span>')+'</div>';}
 // the frame nearest day time t
 function frameAt(t){let lo=0,hi=F.length-1;while(lo<hi){const mid=(lo+hi)>>1;if(F[mid].t<t)lo=mid+1;else hi=mid;}
  return lo>0&&Math.abs(F[lo-1].t-t)<=Math.abs(F[lo].t-t)?lo-1:lo;}
 // Convert CSS pixels to the canvas coordinates, including when the layout shrinks.
 function canvasPoint(e){const b=cv.getBoundingClientRect();return [(e.clientX-b.left-cv.clientLeft)*W/cv.clientWidth,(e.clientY-b.top-cv.clientTop)*H/cv.clientHeight];}
 // drag pans, the wheel zooms about the pointer (both change the shared view, then h.redraw()),
 // a click calls h.click({veh: id|null, ped: [x,y]|null}) for what is under the pointer at frame h.fi()
 function bind(h){let drag=null,moved=false;
  cv.onmousedown=e=>{drag=[...canvasPoint(e),V.ox,V.oy];moved=false;};
  window.addEventListener('mouseup',()=>{drag=null;});
  cv.onmousemove=e=>{if(!drag)return;const [x,y]=canvasPoint(e),dx=x-drag[0],dy=y-drag[1];if(Math.abs(dx)+Math.abs(dy)>3)moved=true;V.ox=drag[2]-dx/V.scale;V.oy=drag[3]+dy/V.scale;h.redraw();};
  cv.onwheel=e=>{e.preventDefault();const [x,y]=canvasPoint(e);const wx=(x-W/2)/V.scale+V.ox,wy=-(y-H/2)/V.scale+V.oy;V.scale*=e.deltaY<0?1.2:1/1.2;V.scale=Math.max(0.3,Math.min(40,V.scale));V.ox=wx-(x-W/2)/V.scale;V.oy=wy+(y-H/2)/V.scale;h.redraw();};
  cv.onclick=e=>{if(moved)return;const [x,y]=canvasPoint(e);const scale=V.scale;const wx=(x-W/2)/scale+V.ox,wy=-(y-H/2)/scale+V.oy;const f=F[h.fi()];
   let best=null;for(const r of Object.values(f.v)){const d=Math.hypot(r[1]-wx,r[2]-wy);if(d<Math.max(3,10/scale)&&(!best||d<best[0]))best=[d,r[0]];}
   let bp=null;for(const p of f.p){const d=Math.hypot(p[0]-wx,p[1]-wy);if(d<Math.max(1.5,8/scale)&&(!bp||d<bp[0]))bp=[d,p];}
   if(bp&&(!best||bp[0]<best[0]*0.5))h.click({veh:null,ped:[bp[1][0],bp[1][1]]});else if(best)h.click({veh:best[1],ped:null});else h.click({veh:null,ped:null});};}
 return {F,M,S,VI,V,CARS,fit,fitScale,draw,pinHTML,frameAt,bind};
}
// ==PANE-END==
(function(){
const D=JSON.parse(document.getElementById('data').textContent);
const G=JSON.parse(document.getElementById('diagdata').textContent)||{};
const CARS={};for(const c of (G.cars||[]))CARS[c.id]=c;
const cv=document.getElementById('cv');
const V={};
const P=makePane(cv,D,{view:V,cars:CARS,chain:true});
const M=P.M,F=P.F;
document.getElementById('legend').innerHTML=legendHTML();
function fit(){P.fit();}
let fi=0,playing=false,speed=1,lastTs=null,acc=0;
const st={pinned:null,pinP:null,msg:'',flashUntil:0};
const scrub=document.getElementById('scrub');scrub.max=F.length-1;
document.getElementById('sub').textContent=`${M.map} · ${M.fixture} · window middle ${M.mid_hms} · centre (${M.center}) · radius ${M.radius} m · ${M.fps} fps · ${F.length} frames`;
document.getElementById('notes').textContent=(M.notes&&M.notes.length?'Game notes:\n'+M.notes.join('\n'):'');
// ---- the diagnosis: ids are links that pin the vehicle at the start of its stand
function link(text,t){return esc(text).replace(/#(\d+)/g,(m,id)=>{const tt=(CARS[id]&&CARS[id].start)||t||M.mid_hms;return `<a class="vid" href="#pin=${id}&t=${tt}&zoom=2">#${id}</a>`;});}
(function(){const el=document.getElementById('diag');if(!G.roots){return;}
 let h='<details open><summary>Diagnosis: root causes ('+G.roots.length+')</summary><div class="note">'+(G.head||[]).map(esc).join('\n')+'</div><div class="roots">';
 for(const r of G.roots){const m=r.match(/^ROOT CAUSE (\S+)/);const fid=(r.match(/#\d+/g)||[]).map(x=>x.slice(1)).find(i=>CARS[i]);h+='<div>'+(m?'<b>'+esc(m[1])+'</b> ':'')+link(m?r.slice(m[0].length):r,fid?CARS[fid].start:null)+'</div>';}
 h+='</div></details>';
 const withChain=(G.cars||[]).filter(c=>c.hops&&c.hops.length);
 h+='<details><summary>Per-vehicle wait chains ('+(G.cars||[]).length+' vehicles stood 15 s or more'+(G.trimmed?'; '+G.trimmed+' chains left out for size, see the diagnose file':'')+')</summary><div class="chains">';
 for(const c of (G.cars||[])){h+='<div class="car">'+link(c.head,c.start);
  if(c.hops&&c.hops.length){h+='<div class="mut">chain at '+esc(c.at)+(c.cycle?' (CYCLE)':'')+':</div>';
   c.hops.forEach((x,k)=>{h+='<div class="hop'+(k==c.hops.length-1?' term':'')+'">'+link(x,c.start)+'</div>';});}
  h+='</div>';}
 h+='</div></details>';el.innerHTML=h;
 const cl=document.getElementById('carlist');
 if((G.cars||[]).length){cl.innerHTML='<div style="margin:6px 0 2px"><b>Diagnosed vehicles</b> <span class="mut">(id · why · s stood)</span></div><div class="cars">'+[...G.cars].sort((a,b)=>b.stood-a.stood).map(c=>`<button data-id="${c.id}" title="stood from ${c.start}">#${c.id} · ${esc(c.why)} · ${c.stood}s</button>`).join('')+'</div>';
  cl.onclick=e=>{const b=e.target.closest('button');if(!b)return;go(b.dataset.id,CARS[b.dataset.id].start,2);};}
})();
function draw(){
 P.draw(fi,st);
 document.getElementById('time').textContent=hms(F[fi].t);scrub.value=fi;
 panel();
}
function panel(){const el=document.getElementById('pin');
 for(const b of document.querySelectorAll('#carlist button'))b.classList.toggle('on',+b.dataset.id===st.pinned);
 el.innerHTML=P.pinHTML(fi,st);}
function tick(ts){if(!playing){lastTs=null;return;}if(lastTs!=null){acc+=(ts-lastTs)/1000*speed;}lastTs=ts;
 while(fi<F.length-1&&acc>=F[fi+1].t-F[fi].t){acc-=F[fi+1].t-F[fi].t;fi++;}
 if(fi>=F.length-1){playing=false;document.getElementById('play').textContent='Play';}draw();requestAnimationFrame(tick);}
function flashLoop(){if(playing)return;draw();if(performance.now()<st.flashUntil)requestAnimationFrame(flashLoop);else draw();}
// pin vehicle `id` at time `t` (HH:MM:SS), centre on it, draw its chain, flash it
function go(id,t,zoom){id=+id;if(!Number.isFinite(id))return;st.msg='';st.pinned=id;st.pinP=null;
 if(t){const tt=secs(t);let b=0;for(let i=0;i<F.length;i++)if(Math.abs(F[i].t-tt)<Math.abs(F[b].t-tt))b=i;fi=b;}
 if(!F[fi].v[id]){let b=-1;for(let i=0;i<F.length;i++)if(F[i].v[id]&&(b<0||Math.abs(i-fi)<Math.abs(b-fi)))b=i;
  if(b<0)st.msg=`vehicle ${id} is not in this trace (outside its ${M.radius} m area)`;else{st.msg=`vehicle ${id} is in the area only from ${hms(F[b].t)}: shown then`;fi=b;}}
 if(zoom)V.scale=+zoom;const r=F[fi].v[id];if(r){V.ox=r[1];V.oy=r[2];}
 acc=0;st.flashUntil=performance.now()+4000;requestAnimationFrame(flashLoop);
 const want=`pin=${id}&t=${hms(F[fi].t)}&zoom=${zoom||V.scale.toFixed(1)}`;if(location.hash.slice(1)!==want)history.replaceState(null,'','#'+want);}
function applyHash(){const h=new URLSearchParams(location.hash.slice(1));if(h.get('pin'))go(h.get('pin'),h.get('t'),h.get('zoom'));else if(h.get('t')){go(NaN);}}
window.addEventListener('hashchange',applyHash);
document.addEventListener('click',e=>{const a=e.target.closest('a.vid');if(!a)return;e.preventDefault();const h=new URLSearchParams(a.getAttribute('href').slice(1));go(h.get('pin'),h.get('t'),h.get('zoom'));cv.scrollIntoView({block:'nearest',behavior:'smooth'});});
document.getElementById('find').onkeydown=e=>{if(e.key!=='Enter')return;const id=e.target.value.replace(/[^0-9]/g,'');if(!id)return;go(id,CARS[id]?CARS[id].start:null,2);};
document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'Pause':'Play';if(playing){if(fi>=F.length-1)fi=0;acc=0;requestAnimationFrame(tick);}};
document.getElementById('spd').onchange=e=>{speed=+e.target.value;};
document.getElementById('fit').onclick=()=>{fit();draw();};
scrub.oninput=()=>{fi=+scrub.value;acc=0;draw();};
P.bind({fi:()=>fi,redraw:draw,click:h=>{st.msg='';
 if(h.ped){st.pinP=h.ped;st.pinned=null;}else if(h.veh!=null){st.pinned=h.veh;st.pinP=null;}else{st.pinned=null;st.pinP=null;}draw();}});
window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'&&e.target.type==='text')return;if(e.key===' '){e.preventDefault();document.getElementById('play').click();}else if(e.key==='ArrowRight'){fi=Math.min(F.length-1,fi+1);draw();}else if(e.key==='ArrowLeft'){fi=Math.max(0,fi-1);draw();}});
// start at the window's middle; #pin=<vehicle id>&t=HH:MM:SS&zoom=<px per m> opens a vehicle pinned
let m=0;for(let i=0;i<F.length;i++)if(Math.abs(F[i].t-M.mid)<Math.abs(F[m].t-M.mid))m=i;fi=m;
draw();applyHash();if(st.pinned!=null)setTimeout(()=>cv.scrollIntoView({block:'center'}),50);
})();
</script></body></html>
