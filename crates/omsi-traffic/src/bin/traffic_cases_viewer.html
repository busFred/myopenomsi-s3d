<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>__TITLE__</title>
<style>
:root{color-scheme:light;--fg:#182536;--mut:#506176;--bd:#c8d2df;--cd:#ffffff;--ac:#075daf;--bg:#f2f5f9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);padding:28px 24px 40px}
.tc{font:15px/1.6 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--fg);max-width:1200px;margin:auto}
.tc h1{font-size:clamp(22px,2.5vw,30px);line-height:1.25;letter-spacing:-.025em;margin:0 0 12px}
.tc a{color:var(--ac);text-underline-offset:3px}
.tc a:hover{color:#03467f}
.tc a.vid{font-weight:650;text-decoration:none;border-bottom:1px dotted var(--ac);padding:1px 2px}
.tc .row{display:grid;grid-template-columns:minmax(0,700px) minmax(280px,1fr);gap:16px;align-items:start}
.tc canvas{display:block;width:100%;height:auto;aspect-ratio:700/520;border:1px solid #9cacc0;border-radius:10px;background:#1d2126;cursor:crosshair}
.tc .side{min-width:0;border:1px solid var(--bd);border-radius:10px;background:var(--cd);padding:18px;max-height:520px;overflow:auto;scrollbar-color:#9cacc0 var(--cd)}
.tc .ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:20px 0 14px;padding:14px;border:1px solid var(--bd);border-radius:10px;background:var(--cd)}
.tc .ctl input[type=range]{flex:1;min-width:120px;accent-color:#075daf;cursor:pointer;height:32px}
.tc button,.tc select,.tc input[type=text]{font:inherit;color:var(--fg);background:#edf2f8;border:1px solid #9cacc0;border-radius:6px;padding:7px 12px;min-height:40px}
.tc button{cursor:pointer;font-weight:600}
.tc button:hover,.tc select:hover{background:#dce9f7;border-color:#075daf}
.tc :is(button,select,input,a,summary):focus-visible{outline:3px solid #075daf;outline-offset:3px}
.tc #play{background:#075daf;color:#ffffff;border-color:#075daf;min-width:76px}
.tc #play:hover{background:#03467f}
.tc input[type=text]{width:164px;min-width:0}
.tc input::placeholder{color:#596b80;opacity:1}
.tc .mut{color:var(--mut)}
.tc #sub{margin-bottom:20px;max-width:100ch}
.tc table{border-collapse:collapse;width:100%;margin:12px 0;font-variant-numeric:tabular-nums}
.tc td{padding:6px 5px;border-bottom:1px solid var(--bd);vertical-align:top;overflow-wrap:anywhere}
.tc td:first-child{color:var(--mut);white-space:nowrap;width:38%}
.tc .lg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;margin:20px 0 12px;padding-top:16px;border-top:1px solid var(--bd);font-size:13px}
.tc .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tc .note{font-size:14px;line-height:1.65;color:var(--mut);white-space:pre-wrap;overflow-wrap:anywhere}
.tc .t{font:600 17px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums;min-width:84px;color:#182536}
.tc details{border:1px solid var(--bd);border-radius:10px;margin:14px 0;padding:14px 18px;background:var(--cd)}
.tc summary{cursor:pointer;font-weight:650;color:#233e5d}
.tc details[open]>summary{margin-bottom:12px}
.tc .shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:14px;margin-top:12px}
.tc .shots a{display:block;background:#e9eef5;border-radius:8px}
.tc .shots img{display:block;width:100%;height:auto;max-height:300px;object-fit:contain;border:1px solid var(--bd);border-radius:8px}
.tc .roots div{margin:12px 0;padding:4px 0 4px 14px;border-left:3px solid #075daf;overflow-wrap:anywhere}
.tc .roots b{color:#075daf}
.tc .chains{max-height:360px;overflow:auto;font-size:14px;scrollbar-color:#9cacc0 var(--cd)}
.tc .car{margin:0 0 14px;padding-bottom:14px;border-bottom:1px solid var(--bd);overflow-wrap:anywhere}
.tc .hop{padding-left:18px;color:var(--mut)}
.tc .hop.term{color:var(--fg)}
.tc .cars{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.tc .cars button{padding:6px 9px;font-size:13px;min-height:34px;font-variant-numeric:tabular-nums}
.tc .cars button.on{background:#075daf;color:#ffffff;border-color:#075daf;outline:2px solid #075daf;outline-offset:2px}
.tc .msg{color:#b42332;font-weight:600;margin-bottom:10px}
@media(max-width:1050px){.tc .row{grid-template-columns:minmax(0,700px);justify-content:center}.tc .side{max-height:none}.tc .lg{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:600px){body{padding:18px 12px 28px}.tc .ctl{gap:10px;padding:12px}.tc .ctl input[type=range]{order:1;flex-basis:100%}.tc input[type=text]{flex:1;width:120px}.tc .side,.tc details{padding:14px}.tc .lg{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body>
<div class="tc">
<h1>__TITLE__</h1>
<div class="mut" id="sub"></div>
__SHOTS__
<div id="diag"></div>
<div class="ctl"><button id="play">Play</button><select id="spd" aria-label="Playback speed"><option>0.5</option><option selected>1</option><option>2</option><option>4</option><option>8</option></select><span class="t" id="time"></span><input type="range" id="scrub" aria-label="Timeline" min="0" value="0"><button id="fit" title="reset the view">Fit</button><button id="mask" title="M: off / mask / mask+edges — the lanes' footprints as the simulation has them">Mask: off</button><input type="text" id="find" aria-label="Find vehicle id" placeholder="find vehicle id" title="type a vehicle id, Enter"></div>
<div class="row"><canvas id="cv" width="700" height="520"></canvas>
<div class="side"><div id="pin"><span class="mut">Click a vehicle or a pedestrian. Drag to pan, wheel to zoom.</span></div>
<div id="carlist"></div>
<div class="lg" id="legend"></div><div class="note" id="notes"></div></div></div>
</div>
<script id="data" type="application/json">__DATA__</script>
<script id="diagdata" type="application/json">__DIAG__</script>
<script id="opts" type="application/json">__OPTS__</script>
<script>
// ==PANE-BEGIN== (shared by traffic_cases_viewer.html and traffic_cases_viewer2.html: viewer2 gets this block pasted in by traffic_cases.rs)
const WHY={none:'#8b949e',lead:'#4f8ef7',light:'#e5534b',yield:'#f0883e',exit:'#f0883e',people:'#b57edc',zebra:'#b57edc',service:'#3fb950',merge:'#2bb5a8',let_out:'#2bb5a8',pull_out:'#8b949e',end:'#8b949e'};
const LEG=[['none','#8b949e'],['lead','#4f8ef7'],['light','#e5534b'],['yield / exit','#f0883e'],['people / zebra','#b57edc'],['service','#3fb950'],['merge / let_out','#2bb5a8'],['player bus','#ffffff']];
function legendHTML(){return LEG.map(([n,c])=>`<span><span class="sw" style="background:${c};border:1px solid #555"></span>${n}</span>`).join('')+`<span><span class="sw" style="border:2px solid #ffd33d"></span>passing</span><span><span class="sw" style="border-radius:5px;background:#ccc"></span>person (ring: decision)</span>`;}
const MASK_NAMES=['off','mask','mask+edges'];
// the boundary mask's colours: every lane's footprint by what it is to the simulation
const MC={fwd:'rgba(72,132,224,0.48)',rev:'rgba(52,190,160,0.48)',bus:'rgba(240,160,40,0.52)',rail:'rgba(160,112,70,0.5)',walk:'rgba(190,192,150,0.45)',cross:'rgba(240,240,250,0.42)',stub:'rgba(245,225,60,0.7)'};
const MLEG=[['street lane (path direction)',MC.fwd],['street lane (reversed twin)',MC.rev],['bus / no_cars / density 0',MC.bus],['rail',MC.rail],['pavement',MC.walk],['crossing piece',MC.cross],['lit stub',MC.stub]];
function maskLegendHTML(){return MLEG.map(([n,c])=>`<span><span class="sw" style="background:${c};border:1px solid #777"></span>${n}</span>`).join('')+`<span><span class="sw" style="background:repeating-linear-gradient(135deg,#999 0 2px,transparent 2px 5px);border:1px solid #777"></span>junction piece (hatched)</span><span><span class="sw" style="border:1px solid #fff;background:#333"></span>edges: lane ±width/2</span><span><span class="sw" style="border:1px dashed #ff8bd0"></span>people keep-off: max(w,2.5)/2+0.3</span><span><span class="sw" style="border:1px solid #ff4fc8;border-radius:2px"></span>hovered car: its way ±(half width+0.3)</span><span><span class="sw" style="border-radius:5px;background:#ccc;width:8px;height:8px"></span>person r 0.28 (ring: decision, square: at kerb)</span><span><span class="sw" style="background:#ffd33d;transform:rotate(45deg);width:9px;height:9px"></span>kerb (crossing's end)</span><span><span class="sw" style="border-top:3px solid #fff;height:4px"></span>stop line (dashed: the 0.6 m gap)</span><span><span class="sw" style="border-top:2px solid #e6e6ff;height:3px"></span>crossing cut of a lane</span><span><span class="sw" style="border:2px solid #00e5ff"></span>clicked lane's next</span><span><span class="sw" style="border:2px solid #ff00c8"></span>clicked lane's prev</span>`;}
function lightCol(s){if(s==null||s<0)return '#555';if(s<=2)return '#e5534b';if(s<=5)return '#f0883e';if(s<=7)return '#3fb950';if(s==8)return '#a3d65c';if(s<=11)return '#e3b341';return '#444';}
function lightName(s){if(s==null||s<0)return '?';if(s<=2)return 'red';if(s<=5)return 'red+yellow';if(s<=7)return 'green';if(s==8)return 'green+yellow';if(s<=11)return 'yellow';return 'dark';}
const PC=['#e6edf3','#79c0ff','#ffa657','#d2a8ff','#7ee787','#ff7b72','#f2cc60','#56d4dd'];
function stateCol(i){return PC[(i==null?0:i)%PC.length];}
function hms(t){t=Math.round(t);return [Math.floor(t/3600),Math.floor(t/60)%60,t%60].map(x=>String(x).padStart(2,'0')).join(':');}
function secs(s){const [h,mi,se]=s.split(':').map(Number);return h*3600+mi*60+(se||0);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function row(k,v){return `<tr><td>${k}</td><td>${v==null?'<span class="mut">-</span>':v}</td></tr>`;}
// the fields of one vehicle row, as [name, html]
const TURN=['straight','left','right'],BLK=['off','left','right','hazard'];
function vehFields(r){const it=r[16],ln=it&&it.length>1?it.slice(1):null;
 return [['lane / s',r[11]+' / '+r[12]],['speed',r[4]+' m/s'],['why','<b style="color:'+(WHY[r[5]]||'')+'">'+r[5]+'</b>'],['stop',r[6]],['lead_id',r[7]],['wait_for',r[8]],['impatience',r[9]],['held',r[13]?'yes':'no'],['hold',r[14]],['passing',r[10]?'yes':'no'],['heading',r[3]+'°'],['indicator',BLK[r[15]||0]],['intends',ln?TURN[it[0]]+' via lanes '+ln.join(' → '):'no planned way']];}
// One canvas showing one trace. `o.view` is the {scale,ox,oy} the pane draws with (several panes may share one),
// `o.cars` the diagnosed vehicles by id, `o.chain` false leaves the wait chain of the pinned vehicle out.
// The caller owns the state: draw(fi, st) with st = {pinned, pinP, msg, flashUntil}.
function makePane(cv,D,o){
 o=o||{};const V=o.view||{};const CARS=o.cars||{};const chain=o.chain!==false;
 // the boundary mask: 0 off, 1 the footprints, 2 footprints and edges; hov = what the pointer is on, sel = the clicked lane
 let mask=o.mask|0,hov=null,sel=null;
 const M=D.meta,S=D.strs||[],VI=D.vinfo||{};
 const cx=cv.getContext('2d');
 const W=700,H=520;
 const dpr=window.devicePixelRatio||1;cv.width=W*dpr;cv.height=H*dpr;cx.scale(dpr,dpr);
 // frames: full rows per frame (k = ids unchanged since the previous frame)
 const F=[];let prev={},lights={},prevP=[];
 for(const f of D.frames){const cur={};
  for(const e of f.v){const id=e[0],m=e[1],o=prev[id];const r=o?o.slice():new Array(17).fill(null);r[0]=id;let j=2;for(let b=0;b<16;b++)if(m&(1<<b))r[b+1]=e[j++];cur[id]=r;}
  if(f.k)for(const id of f.k){if(prev[id])cur[id]=prev[id];}
  if(f.l){lights=Object.assign({},lights);for(const [c,li,st] of f.l)lights[c+'/'+li]=st;}
  const P=(f.pk||[]).map(i=>prevP[i]).filter(Boolean).concat(f.p||[]);
  F.push({t:f.t,v:cur,p:P.map(q=>[q[0],q[1],q[2],q[3],q[4]?Math.max(0,Math.round(f.t-q[4])):0,q[5],q[6]]),pl:f.pl,l:lights});prev=cur;prevP=P;}
 const cross=new Set();for(const c of D.crossings)for(const l of c.lanes)cross.add(l);
 const LI={};for(const L of D.lanes)LI[L[0]]=L;
 const PR=M.person_radius||0.28,KC=M.kerb_clear||0.3,LMW=M.lane_min_width||2.5,SLG=M.stop_line_gap||0.6;
 // ---- the boundary mask's geometry (world coordinates, computed once)
 function laneLen(p){let d=0;for(let i=1;i<p.length;i++)d+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);return d;}
 // what a lane is to the simulation: the colour class of its footprint
 function laneClass(L){if(L[1]==='R')return 'rail';if(L[1]==='W'){if(L[3]&&laneLen(L[8])<=1.6)return 'stub';if(cross.has(L[0]))return 'cross';return 'walk';}if(L[9]||L[5]===0)return 'bus';return L[11]?'rev':'fwd';}
 const CLASS_ORDER={walk:0,rail:1,fwd:2,rev:2,bus:2,cross:3,stub:4};
 // the centreline offset by ±hw, mitred at the joints (the mitre at most twice hw): {l, r} point lists
 function offsetPoly(p,hw){p=p.filter((q,i)=>!i||Math.hypot(q[0]-p[i-1][0],q[1]-p[i-1][1])>1e-3);const n=p.length,l=[],r=[];if(n<2)return null;
  const dir=[];for(let i=0;i<n-1;i++){const dx=p[i+1][0]-p[i][0],dy=p[i+1][1]-p[i][1],d=Math.hypot(dx,dy)||1e-9;dir.push([dx/d,dy/d]);}
  for(let i=0;i<n;i++){const d0=dir[Math.max(0,i-1)],d1=dir[Math.min(n-2,i)];
   // the normal to the right of the direction (x east, y north)
   const n0=[d0[1],-d0[0]],n1=[d1[1],-d1[0]];let mx=n0[0]+n1[0],my=n0[1]+n1[1];const ml=Math.hypot(mx,my);
   let k=1;if(ml<1e-6){mx=n1[0];my=n1[1];}else{mx/=ml;my/=ml;k=1/Math.max(0.5,mx*n1[0]+my*n1[1]);}
   l.push([p[i][0]-mx*hw*k,p[i][1]-my*hw*k]);r.push([p[i][0]+mx*hw*k,p[i][1]+my*hw*k]);}
  return {l,r};}
 const FP={};// lane id -> {L, cls, hw, poly (closed ring), len, l, r}
 for(const L of D.lanes){const p=L[8];if(!p||p.length<2)continue;const w=L[2]||(L[1]==='W'?1.5:3);const hw=w/2;const o=offsetPoly(p,hw);if(!o)continue;
  FP[L[0]]={L,cls:laneClass(L),hw,l:o.l,r:o.r,poly:o.l.concat(o.r.slice().reverse()),len:laneLen(p)};}
 const MASK_LANES=Object.values(FP).sort((a,b)=>CLASS_ORDER[a.cls]-CLASS_ORDER[b.cls]);
 function inPoly(q,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if((a[1]>q[1])!==(b[1]>q[1])&&q[0]<(b[0]-a[0])*(q[1]-a[1])/(b[1]-a[1])+a[0])c=!c;}return c;}
 // the lane whose footprint holds world point q: the top-drawn one (stubs over crossings over streets over pavements)
 function laneAt(q){let best=null;for(const f of MASK_LANES){if(inPoly(q,f.poly))best=f;}return best;}
 // the nearest point of polyline p to q: [distance, signed lateral (+ right of the way), along]
 function nearestOn(p,q){let bd=1e18,bl=0,ba=0,acc=0;for(let i=0;i<p.length-1;i++){const ax=p[i][0],ay=p[i][1],dx=p[i+1][0]-ax,dy=p[i+1][1]-ay,l2=dx*dx+dy*dy||1e-9,len=Math.sqrt(l2);const t=Math.max(0,Math.min(1,((q[0]-ax)*dx+(q[1]-ay)*dy)/l2));const px=ax+dx*t,py=ay+dy*t;const d=Math.hypot(px-q[0],py-q[1]);if(d<bd){bd=d;const cr=(dx*(q[1]-ay)-dy*(q[0]-ax))/len;bl=-cr;ba=acc+t*len;}acc+=len;}return [bd,bl,ba];}
 // the point and unit direction at distance s along polyline p
 function alongAt(p,s){let acc=0;for(let i=0;i<p.length-1;i++){const dx=p[i+1][0]-p[i][0],dy=p[i+1][1]-p[i][1],len=Math.hypot(dx,dy)||1e-9;if(acc+len>=s||i===p.length-2){const t=Math.max(0,Math.min(1,(s-acc)/len));return [[p[i][0]+dx*t,p[i][1]+dy*t],[dx/len,dy/len]];}acc+=len;}return null;}
 // the kerbs of the compiled crossings: the ends of a crossing's chain of pieces no other piece of it joins
 const KERBS=[];for(const c of D.crossings){const ends=[];for(const id of c.lanes){const L=LI[id];if(!L||!L[8]||L[8].length<2)continue;ends.push(L[8][0],L[8][L[8].length-1]);}
  ends.forEach((e,i)=>{if(!ends.some((f,j)=>j!==i&&Math.hypot(e[0]-f[0],e[1]-f[1])<0.5))KERBS.push(e);});}
 // the crossings' cuts of the street lanes: [point, direction, lane width]
 const CUTS=[];for(const c of D.crossings)for(const q of (c.cuts||[])){const L=LI[q[0]];if(!L||!L[8])continue;const a=alongAt(L[8],q[1]);if(a)CUTS.push([a[0],a[1],L[2]||3,q[0],q[2]]);}
 let hatch=null;function hatchPat(){if(hatch)return hatch;const c=document.createElement('canvas');c.width=c.height=8;const g=c.getContext('2d');g.strokeStyle='rgba(255,255,255,0.45)';g.lineWidth=1.2;g.beginPath();g.moveTo(-2,10);g.lineTo(10,-2);g.moveTo(-2,2);g.lineTo(2,-2);g.moveTo(6,10);g.lineTo(10,6);g.stroke();hatch=cx.createPattern(c,'repeat');return hatch;}
 const KIND={S:'street',W:'footpath',R:'rail',A:'air'};
 // the text of a lane, as [name, value] rows (the mask's tooltip and the side box)
 function laneRows(f){const L=f.L,ex=L.length>9;const jn=L[14];
  const rows=[['kind',KIND[L[1]]||L[1],],['class',f.cls+(ex&&L[10]===2?' · junction piece':'')],['width',L[2]+' m (±'+(L[2]/2).toFixed(2)+')'],['length',f.len.toFixed(1)+' m, '+L[8].length+' pts']];
  if(L[1]==='S')rows.push(['people keep off','±'+(Math.max(L[2],LMW)/2+KC).toFixed(2)+' m of the axis']);
  rows.push(['density',L[5]],['no_overtaking',L[4]?'yes':'no'],['turn',TURN[L[6]]||L[6]],['rule bus',L[7]?'yes':'no'],['light',L[3]?L[3][0]+'/'+L[3][1]:null]);
  if(ex)rows.push(['no_cars',L[9]?'yes':'no'],['source',L[10]===1?'1 spline':L[10]===2?'2 crossing object':L[10]],['reversed',L[11]?'yes':'no'],['one_way',L[12]?'yes':'no'],['stop line',L[13]!=null?'front stops '+L[13]+' m from the start':null],['junction',jn!=null?jn+' · '+L[15]+' foes':null],['left / right',(L[16]==null?'-':L[16])+' / '+(L[17]==null?'-':L[17])],['next',(L[18]||[]).join(', ')||'-'],['prev',(L[19]||[]).join(', ')||'-'],['file',L[20]||null],['speed',L[21]!=null?L[21]+' km/h':null],['offset',L[22]!=null?L[22]+' m':null],['no_unsched',L[23]?'yes':null]);
  return rows.filter(r=>r[1]!=null);}
 function laneHTML(id){const f=FP[id];if(!f)return '';return '<b>lane '+id+'</b> <span class="mut">(click elsewhere to unpin)</span><table>'+laneRows(f).map(([k,v])=>row(k,esc(String(v)))).join('')+'</table><div class="mut">chain: cyan = next, magenta = prev (6 hops each)</div>';}
 // a vehicle against its lane: [signed lateral offset, overhang left, overhang right] (m)
 function vehLat(r){const L=LI[r[11]];if(!L||!L[8])return null;const inf=VI[r[0]]||[2.2,2.2,0.9];const [d,lat]=nearestOn(L[8],[r[1],r[2]]);const hw=inf[2],lw=L[2]/2;return [lat,(-lat+hw)-lw,(lat+hw)-lw,L];}
 // a person against the nearest street lane: [lane, distance from its axis, inside the keep-off]
 function pedLat(p){let best=null;for(const f of MASK_LANES){if(f.L[1]!=='S')continue;const [d]=nearestOn(f.L[8],[p[0],p[1]]);if(d<6&&(!best||d<best[1]))best=[f,d];}if(!best)return null;const keep=Math.max(best[0].L[2],LMW)/2+KC;return [best[0].L[0],best[1],best[1]<keep,keep,best[0].hw];}
 // the lamps of an indicator state (1 left, 2 right, 3 hazard) at the front corners of a box already translated and rotated to the vehicle
 function lamps(b,fr,hw,scale,on){if(!b||!on)return;const rad=Math.max(2.5,0.45*scale);cx.fillStyle='#ffb000';cx.strokeStyle='#3a2600';cx.lineWidth=1;
  for(const side of [-1,1]){if(!(b===3||b===(side<0?1:2)))continue;cx.beginPath();cx.arc(side*(hw*scale-rad*0.3),-fr*scale+rad*0.3,rad,0,7);cx.fill();cx.stroke();}}

   if(!drag){if(!mask){if(hov){hov=null;h.redraw();}return;}const u=under(x,y,F[h.fi()]);const nh={veh:u.veh,ped:u.ped,pl:u.pl,lane:u.veh!=null||u.ped||u.pl!=null?null:u.lane,at:[x,y]};
    const same=hov&&hov.veh===nh.veh&&hov.ped===nh.ped&&hov.pl===nh.pl&&hov.lane===nh.lane&&Math.abs(hov.at[0]-x)<1&&Math.abs(hov.at[1]-y)<1;if(!same){hov=nh;h.redraw();}return;}
   const dx=x-drag[0],dy=y-drag[1];if(Math.abs(dx)+Math.abs(dy)>3)moved=true;V.ox=drag[2]-dx/V.scale;V.oy=drag[3]+dy/V.scale;h.redraw();};
  cv.onmouseleave=()=>{if(hov){hov=null;h.redraw();}};
  cv.onwheel=e=>{e.preventDefault();const [x,y]=canvasPoint(e);const wx=(x-W/2)/V.scale+V.ox,wy=-(y-H/2)/V.scale+V.oy;V.scale*=e.deltaY<0?1.2:1/1.2;V.scale=Math.max(0.3,Math.min(40,V.scale));V.ox=wx-(x-W/2)/V.scale;V.oy=wy+(y-H/2)/V.scale;h.redraw();};
  cv.onclick=e=>{if(moved)return;const [x,y]=canvasPoint(e);const u=under(x,y,F[h.fi()]);
   // (a click on a lane's footprint pins it: its next / prev chains; on nothing unpins)
   sel=u.veh!=null||u.ped?null:u.lane;
   if(u.ped)h.click({veh:null,ped:[u.ped[0],u.ped[1]],lane:null});else h.click({veh:u.veh,ped:null,lane:sel});};}
 function setMask(m){mask=((m|0)%3+3)%3;if(!mask){hov=null;sel=null;}}
 function setSel(id){sel=id!=null&&FP[id]?id:null;}
 // (for a page's screenshot: the tooltip of world point [x,y] as if the pointer were there)
 function hoverAt(x,y){const X=sx(x),Y=sy(y);const u=hitAt(X,Y);hov={veh:u.veh,ped:u.ped,pl:u.pl,lane:u.veh!=null||u.ped||u.pl!=null?null:u.lane,at:[X,Y]};}
 let hitAt=()=>({});
 return {F,M,S,VI,V,CARS,fit,fitScale,draw,pinHTML,frameAt,bind,setMask,maskMode:()=>mask,laneHTML,setSel,sel:()=>sel,hoverAt};
}
// ==PANE-END==
(function(){
const D=JSON.parse(document.getElementById('data').textContent);
const G=JSON.parse(document.getElementById('diagdata').textContent)||{};
const O=(()=>{try{return JSON.parse(document.getElementById('opts').textContent)||{};}catch(e){return {};}})();
const CARS={};for(const c of (G.cars||[]))CARS[c.id]=c;
const cv=document.getElementById('cv');
const V={};
const P=makePane(cv,D,{view:V,cars:CARS,chain:true,mask:O.mask|0});
const M=P.M,F=P.F;
function maskUI(){const m=P.maskMode();document.getElementById('mask').textContent='Mask: '+MASK_NAMES[m];document.getElementById('legend').innerHTML=legendHTML()+(m?'<span style="grid-column:1/-1;border-top:1px solid var(--bd);padding-top:8px;margin-top:4px"><b>Boundary mask</b>'+(M.footprints?'':' <span class="mut">(trace without --footprints: pavements away from crossings are not in it)</span>')+'</span>'+maskLegendHTML():'');}
maskUI();
document.getElementById('mask').onclick=()=>{P.setMask(P.maskMode()+1);maskUI();draw();};
function fit(){P.fit();}
let fi=0,playing=false,speed=1,lastTs=null,acc=0;
const st={pinned:null,pinP:null,msg:'',flashUntil:0};
const scrub=document.getElementById('scrub');scrub.max=F.length-1;
document.getElementById('sub').textContent=`${M.map} · ${M.fixture} · window middle ${M.mid_hms} · centre (${M.center}) · radius ${M.radius} m · ${M.fps} fps · ${F.length} frames`;
document.getElementById('notes').textContent=(M.notes&&M.notes.length?'Game notes:\n'+M.notes.join('\n'):'');
// ---- the diagnosis: ids are links that pin the vehicle at the start of its stand
function link(text,t){return esc(text).replace(/#(\d+)/g,(m,id)=>{const tt=(CARS[id]&&CARS[id].start)||t||M.mid_hms;return `<a class="vid" href="#pin=${id}&t=${tt}&zoom=2">#${id}</a>`;});}
(function(){const el=document.getElementById('diag');if(!G.roots){return;}
 let h='<details open><summary>Diagnosis: root causes ('+G.roots.length+')</summary><div class="note">'+(G.head||[]).map(esc).join('\n')+'</div><div class="roots">';
 for(const r of G.roots){const m=r.match(/^ROOT CAUSE (\S+)/);const fid=(r.match(/#\d+/g)||[]).map(x=>x.slice(1)).find(i=>CARS[i]);h+='<div>'+(m?'<b>'+esc(m[1])+'</b> ':'')+link(m?r.slice(m[0].length):r,fid?CARS[fid].start:null)+'</div>';}
 h+='</div></details>';
 const withChain=(G.cars||[]).filter(c=>c.hops&&c.hops.length);
 h+='<details><summary>Per-vehicle wait chains ('+(G.cars||[]).length+' vehicles stood 15 s or more'+(G.trimmed?'; '+G.trimmed+' chains left out for size, see the diagnose file':'')+')</summary><div class="chains">';
 for(const c of (G.cars||[])){h+='<div class="car">'+link(c.head,c.start);
  if(c.hops&&c.hops.length){h+='<div class="mut">chain at '+esc(c.at)+(c.cycle?' (CYCLE)':'')+':</div>';
   c.hops.forEach((x,k)=>{h+='<div class="hop'+(k==c.hops.length-1?' term':'')+'">'+link(x,c.start)+'</div>';});}
  h+='</div>';}
 h+='</div></details>';el.innerHTML=h;
 const cl=document.getElementById('carlist');
 if((G.cars||[]).length){cl.innerHTML='<div style="margin:6px 0 2px"><b>Diagnosed vehicles</b> <span class="mut">(id · why · s stood)</span></div><div class="cars">'+[...G.cars].sort((a,b)=>b.stood-a.stood).map(c=>`<button data-id="${c.id}" title="stood from ${c.start}">#${c.id} · ${esc(c.why)} · ${c.stood}s</button>`).join('')+'</div>';
  cl.onclick=e=>{const b=e.target.closest('button');if(!b)return;go(b.dataset.id,CARS[b.dataset.id].start,2);};}
})();
function draw(){
 P.draw(fi,st);
 document.getElementById('time').textContent=hms(F[fi].t);scrub.value=fi;
 panel();
}
function panel(){const el=document.getElementById('pin');
 for(const b of document.querySelectorAll('#carlist button'))b.classList.toggle('on',+b.dataset.id===st.pinned);
 el.innerHTML=P.pinHTML(fi,st);}
function tick(ts){if(!playing){lastTs=null;return;}if(lastTs!=null){acc+=(ts-lastTs)/1000*speed;}lastTs=ts;
 while(fi<F.length-1&&acc>=F[fi+1].t-F[fi].t){acc-=F[fi+1].t-F[fi].t;fi++;}
 if(fi>=F.length-1){playing=false;document.getElementById('play').textContent='Play';}draw();requestAnimationFrame(tick);}
function flashLoop(){if(playing)return;draw();if(performance.now()<st.flashUntil)requestAnimationFrame(flashLoop);else draw();}
// pin vehicle `id` at time `t` (HH:MM:SS), centre on it, draw its chain, flash it
function go(id,t,zoom){id=+id;if(!Number.isFinite(id))return;st.msg='';st.pinned=id;st.pinP=null;
 if(t){const tt=secs(t);let b=0;for(let i=0;i<F.length;i++)if(Math.abs(F[i].t-tt)<Math.abs(F[b].t-tt))b=i;fi=b;}
 if(!F[fi].v[id]){let b=-1;for(let i=0;i<F.length;i++)if(F[i].v[id]&&(b<0||Math.abs(i-fi)<Math.abs(b-fi)))b=i;
  if(b<0)st.msg=`vehicle ${id} is not in this trace (outside its ${M.radius} m area)`;else{st.msg=`vehicle ${id} is in the area only from ${hms(F[b].t)}: shown then`;fi=b;}}
 if(zoom)V.scale=+zoom;const r=F[fi].v[id];if(r){V.ox=r[1];V.oy=r[2];}
 acc=0;st.flashUntil=performance.now()+4000;requestAnimationFrame(flashLoop);
 const want=`pin=${id}&t=${hms(F[fi].t)}&zoom=${zoom||V.scale.toFixed(1)}`;if(location.hash.slice(1)!==want)history.replaceState(null,'','#'+want);}
// #pin=<id>&t=HH:MM:SS&zoom=<px per m> pins a vehicle; #at=x,y&zoom=N&t=HH:MM:SS&mask=0|1|2 opens a place (x,y relative to the centre)
function applyHash(){const h=new URLSearchParams(location.hash.slice(1));if(h.get('mask')!=null){P.setMask(+h.get('mask'));maskUI();}if(h.get('lane')!=null)P.setSel(+h.get('lane'));
 if(h.get('pin'))go(h.get('pin'),h.get('t'),h.get('zoom'));else{if(h.get('t')){const tt=secs(h.get('t'));let b=0;for(let i=0;i<F.length;i++)if(Math.abs(F[i].t-tt)<Math.abs(F[b].t-tt))b=i;fi=b;}
  if(h.get('at')){const [x,y]=h.get('at').split(',').map(Number);if(Number.isFinite(x)&&Number.isFinite(y)){V.ox=x;V.oy=y;}}if(h.get('zoom'))V.scale=Math.max(0.3,Math.min(40,+h.get('zoom')));
  if(h.get('hover')){const [x,y]=h.get('hover').split(',').map(Number);if(Number.isFinite(x)&&Number.isFinite(y))P.hoverAt(x,y);}draw();}}
window.addEventListener('hashchange',applyHash);
document.addEventListener('click',e=>{const a=e.target.closest('a.vid');if(!a)return;e.preventDefault();const h=new URLSearchParams(a.getAttribute('href').slice(1));go(h.get('pin'),h.get('t'),h.get('zoom'));cv.scrollIntoView({block:'nearest',behavior:'smooth'});});
document.getElementById('find').onkeydown=e=>{if(e.key!=='Enter')return;const id=e.target.value.replace(/[^0-9]/g,'');if(!id)return;go(id,CARS[id]?CARS[id].start:null,2);};
document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'Pause':'Play';if(playing){if(fi>=F.length-1)fi=0;acc=0;requestAnimationFrame(tick);}};
document.getElementById('spd').onchange=e=>{speed=+e.target.value;};
document.getElementById('fit').onclick=()=>{fit();draw();};
scrub.oninput=()=>{fi=+scrub.value;acc=0;draw();};
P.bind({fi:()=>fi,redraw:draw,click:h=>{st.msg='';
 if(h.ped){st.pinP=h.ped;st.pinned=null;}else if(h.veh!=null){st.pinned=h.veh;st.pinP=null;}else{st.pinned=null;st.pinP=null;}
 if(P.maskMode()){const want=`at=${V.ox.toFixed(1)},${V.oy.toFixed(1)}&zoom=${V.scale.toFixed(1)}&t=${hms(F[fi].t)}&mask=${P.maskMode()}`+(h.lane!=null?`&lane=${h.lane}`:'');history.replaceState(null,'','#'+want);}draw();}});
window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'&&e.target.type==='text')return;if(e.key==='m'||e.key==='M'){document.getElementById('mask').click();}else if(e.key===' '){e.preventDefault();document.getElementById('play').click();}else if(e.key==='ArrowRight'){fi=Math.min(F.length-1,fi+1);draw();}else if(e.key==='ArrowLeft'){fi=Math.max(0,fi-1);draw();}});
// start at the window's middle; #pin=<vehicle id>&t=HH:MM:SS&zoom=<px per m> opens a vehicle pinned
let m=0;for(let i=0;i<F.length;i++)if(Math.abs(F[i].t-M.mid)<Math.abs(F[m].t-M.mid))m=i;fi=m;
setInterval(()=>{if(!playing&&!document.hidden)P.draw(fi,st);},250);
draw();applyHash();if(st.pinned!=null)setTimeout(()=>cv.scrollIntoView({block:'center'}),50);
})();
</script></body></html>
