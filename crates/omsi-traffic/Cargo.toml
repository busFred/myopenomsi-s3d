[package]
name = "omsi-traffic"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AI road traffic: compiled junctions, driver model, perception/plan/act pipeline, population"

[dependencies]
omsi-sim = { path = "../omsi-sim" }
glam.workspace = true
log.workspace = true
hashbrown = { workspace = true, features = ["serde"] }
serde.workspace = true
# (exact floats: a replay reads back the very numbers the game had)
serde_json = { workspace = true, features = ["float_roundtrip"] }
flate2.workspace = true
# (traffic_cases: the replay's warnings on stderr)
env_logger.workspace = true
